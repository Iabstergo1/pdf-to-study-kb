[pytest]
# Test tiers — see pipeline-workspace/reports/test-audit-2026-07-13.md (P0 re-tiering; 2026-06-25 = original layering)
# File→marker registry lives in tests/_tiering.py; tests/conftest.py applies it and fail-closes on unregistered files.
addopts = --strict-markers

# 收集边界（2026-07-29）：这套件**只有** tests/ 一处。
# testpaths 管裸跑 `pytest`（不带路径参数时只从 tests/ 找）；norecursedirs 管有人显式跑
# `pytest .`。列出的都是 gitignore 过的本机数据目录，不含任何真测试。
#
# 动机：技能自进化测试会生成假的候选技能包，里面塞一个道具文件 `tests/test_ok.py`。
# 一次 `--basetemp=tmp\pt-full-...`（指向仓库自己的 tmp/）跑完没清理，道具就永久留在了树里；
# 这些目录没有 __init__.py，pytest 只能按文件名给模块命名，于是第二个 test_ok.py 起
# `import file mismatch` → 整轮 Interrupted。**裸跑 pytest 直接不可用，而代码毫无问题。**
# 与 tests/_sandbox.py 的 basetemp 守卫同源：那条解决"别倒进别人的工作区"，
# 这条解决"倒进自己仓库会堵住默认测试命令"。运行期兜底见 conftest.pytest_collection_modifyitems。
testpaths = tests
norecursedirs = tmp books wiki pipeline-workspace .mineru-models tools .git .pytest_cache
markers =
    fast: cheap unit/contract tests safe for frequent local runs
    cli: tests that invoke the public command-line surface
    slow: high-cost deterministic tests, usually subprocess or full workflow
    skill: tests for .agents/.claude skill protocol and dual-tree parity
    realbook: tests/scripts needing real source files, MinerU models, or long external workflows
